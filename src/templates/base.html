<!doctype html>
<html lang="de" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gartengestaltung Geißler – Garten- und Landschaftsbau in Eschau{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:site_name" content="Gartengestaltung Geißler">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <link rel="icon" type="image/png" href="{{ asset('img/brand/favicon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ asset('img/brand/favicon-192.png') }}">
  <link rel="preload" href="{{ asset('fonts/Newsreader-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ asset('fonts/HankenGrotesk-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset('fonts/fonts.css') ~ '?v=1789203151' }}">
  <link rel="stylesheet" href="{{ asset('css/main.css') ~ '?v=1789203151' }}">
  {% block styles %}{% endblock %}
  <script>
    (function (d) {
      d.className = "js is-entering";
      setTimeout(function () {
        if (!window.__animReady) d.classList.add("reveal-fallback");
        d.classList.remove("is-entering");
      }, 3200);
    })(document.documentElement);
  </script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}has-hero{% endblock %}">
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <div class="transition" aria-hidden="true"></div>
  {% include 'partials/header.html' %}
  <main class="main" id="main">
    {% block content %}{% endblock %}
  </main>
  {% include 'partials/footer.html' %}
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-cta" aria-hidden="true"><span class="cursor-cta__inner"><span class="cursor-cta__label"></span></span></div>
  <script src="{{ asset('vendor/lenis.min.js') }}"></script>
  <script src="{{ asset('vendor/gsap.min.js') }}"></script>
  <script src="{{ asset('vendor/ScrollTrigger.min.js') }}"></script>
  <script src="{{ asset('vendor/SplitText.min.js') }}"></script>
  <script src="{{ asset('js/main.js') ~ '?v=1789203151' }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
